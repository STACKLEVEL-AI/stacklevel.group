<VirtualHost *:80>
    ServerName stacklevel.group

    RewriteEngine On
    RewriteRule ^ https://stacklevel.group%{REQUEST_URI} [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName stacklevel.group

    SSLEngine on
    SSLCertificateFile /path/to/fullchain.pem
    SSLCertificateKeyFile /path/to/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyAddHeaders On
    AllowEncodedSlashes NoDecode

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass / http://127.0.0.1:3100/ retry=0 connectiontimeout=5 timeout=60 keepalive=On
    ProxyPassReverse / http://127.0.0.1:3100/

    ErrorLog ${APACHE_LOG_DIR}/stacklevel.group-error.log
    CustomLog ${APACHE_LOG_DIR}/stacklevel.group-access.log combined
</VirtualHost>
</IfModule>
