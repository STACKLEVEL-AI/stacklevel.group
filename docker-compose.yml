services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: web
      args:
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    container_name: stacklevel-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - BOT_SENDER_URL=http://bot-sender:4000/internal/send
      - INTERNAL_HMAC_SECRET=${INTERNAL_HMAC_SECRET}
    ports:
      - "127.0.0.1:${WEB_HTTP_PORT:-3100}:3000"
    depends_on:
      - bot-sender
    networks:
      - app

  bot-sender:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: bot-sender
    container_name: stacklevel-bot-sender
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
      - INTERNAL_HMAC_SECRET=${INTERNAL_HMAC_SECRET}
      - RECIPIENT_USER_IDS=${RECIPIENT_USER_IDS}
    networks:
      - app

networks:
  app:
